<Search
  id="autocomplete-anchor"
  [variant]="variant()"
  [class]="cn('search-container', variant() === 'basic' && 'search-container-basic')"
  [placeholder]="'searchInput.placeholder' | transloco"
  [attr.aria-label]="'searchInput.placeholder' | transloco"
  [(ngModel)]="value"
  (keydown)="onKeyDown($event)"
  (click)="inputClicked()">
  @if (showSave() && (value() !== '' || hasFilters())) {
    <button
      variant="icon"
      size="xs"
      class="save-button"
      [attr.title]="'searchInput.saveSearch' | transloco"
      [attr.aria-label]="'searchInput.saveSearch' | transloco"
      (click)="saveQuery($event)"
      (keydown.enter)="saveQuery($event)">
      @if (savedSearch()) {
        <i class="fa-fw fas fa-star save-icon-filled" [ngClass]="{ 'animate-save': saveAnimation() }" aria-hidden="true"></i>
      } @else {
        <i class="fa-fw far fa-star save-icon-outline" [ngClass]="{ 'animate-save': saveAnimation() }" aria-hidden="true"></i>
      }
    </button>
  }

  <div
    style="background: none; margin-top: var(--spacing-sm)"
    popover
    #autocompletePopover
    (keydown.enter)="handlePopoverClick($event)"
    (click)="handlePopoverClick($event)">
    <ng-content></ng-content>
  </div>
</Search>
