@if (previewData()) {
  <div class="main-container">
    @if (previewData() && article()) {
      <section class="header-section">
        <app-preview-header [article]="article()" />
      </section>

      @if (loading()) {
        <section class="loading-container">
          <div class="loading-bar" style="background: linear-gradient(to right, blue, #333, orange, #333, blue)"></div>
        </section>
      }

      <!-- Tab Navigation only if the "display summary is available " -->
      <app-preview-tabs [(activeTab)]="activeTab" [(showAssistants)]="showAssistants" [isStreaming]="isStreaming()" />

      <!-- tab contents -->
      <div class="tab-contents-container">
        <!-- Summary Tab Content -->
        @if (displaySummaryContent()) {
          <div class="tab-content-panel" [hidden]="activeTab() !== 'summary'">
            <assistant
              [instanceId]="summarizeInstanceId()"
              [query]="miniPreviewQuery"
              [showAssistant]="showSummarizeAssistant()"
              (isStreaming)="handleStreaming($event)"
              class="assistant-container" />
          </div>
        }

        <!-- Chat with Doc Tab Content -->
        @if (displayChatWithDocContent()) {
          <div class="tab-content-panel" [hidden]="activeTab() !== 'discussion'">
            <assistant
              [instanceId]="chatWithDocIntanceId()"
              [query]="chatWithDocQuery"
              [showAssistant]="showChatWithDocAssistant()"
              class="assistant-container" />
          </div>
        }

        <!-- Preview Tab Content -->
        <div class="tab-content-panel" [hidden]="activeTab() !== 'preview'">
          <preview-content class="preview-content-container" [previewData]="previewData()!" [(loading)]="loading" />
        </div>
      </div>
    }
  </div>
} @else {
  <div class="section-header">
    <div class="section-header__inner">
      <svg class="section-header__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M5 21C4.45 21 3.97933 20.8043 3.588 20.413C3.19667 20.0217 3.00067 19.5507 3 19V5C3 4.45 3.196 3.97933 3.588 3.588C3.98 3.19667 4.45067 3.00067 5 3H19C19.55 3 20.021 3.196 20.413 3.588C20.805 3.98 21.0007 4.45067 21 5V19C21 19.55 20.8043 20.021 20.413 20.413C20.0217 20.805 19.5507 21.0007 19 21H5ZM5 19H19V7H5V19ZM12 17C10.6333 17 9.41267 16.6293 8.338 15.888C7.26333 15.1467 6.484 14.184 6 13C6.48333 11.8167 7.26267 10.8543 8.338 10.113C9.41333 9.37167 10.634 9.00067 12 9C13.366 8.99933 14.587 9.37033 15.663 10.113C16.739 10.8557 17.518 11.818 18 13C17.5167 14.1833 16.7377 15.146 15.663 15.888C14.5883 16.63 13.3673 17.0007 12 17ZM12 14.5C11.5833 14.5 11.2293 14.3543 10.938 14.063C10.6467 13.7717 10.5007 13.4173 10.5 13C10.4993 12.5827 10.6453 12.2287 10.938 11.938C11.2307 11.6473 11.5847 11.5013 12 11.5C12.4153 11.4987 12.7697 11.6447 13.063 11.938C13.3563 12.2313 13.502 12.5853 13.5 13C13.498 13.4147 13.3523 13.769 13.063 14.063C12.7737 14.357 12.4193 14.5027 12 14.5ZM12 15.5C12.7 15.5 13.2917 15.2583 13.775 14.775C14.2583 14.2917 14.5 13.7 14.5 13C14.5 12.3 14.2583 11.7083 13.775 11.225C13.2917 10.7417 12.7 10.5 12 10.5C11.3 10.5 10.7083 10.7417 10.225 11.225C9.74167 11.7083 9.5 12.3 9.5 13C9.5 13.7 9.74167 14.2917 10.225 14.775C10.7083 15.2583 11.3 15.5 12 15.5Z"
          fill="#1B3439" />
      </svg>
      <p class="section-header__text">Preview</p>
    </div>
  </div>

  <!-- Empty state placeholder -->
  <div class="empty-state">
    <div class="empty-content">
      <h3 class="empty-title">No Document Selected</h3>
      <p class="empty-description">Click on a document from the search results to preview it here</p>
    </div>
  </div>
}
