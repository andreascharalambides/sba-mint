<app-canvas>
  <!-- Loading State -->
  @if (query.isPending()) {
    <span class="loader"></span>

    <!-- Results Found -->
  } @else if (hasRowCount()) {
    <!-- Assistant Widget -->
    @if (allowAI() && !b()) {
      <app-widget-wrapper widgetId="assistant">
        <div class="glass-container glass-container--full">
          <div class="section-header">
            <!-- Header Title-->
            <div class="section-header__inner">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" class="section-header__icon">
                <path
                  d="M4.3677 19.6879C3.76259 19.8166 3.24667 19.2392 3.44239 18.6523L4.17411 16.4584C4.25283 16.2223 4.21494 15.9643 4.08599 15.7515C2.03689 12.3701 2.98681 8.14241 6.39736 5.72365C9.92063 3.22596 14.9807 3.43069 18.2332 6.20302C21.4856 8.97634 21.9253 13.4594 19.2614 16.6901C16.653 19.8534 11.8577 20.8577 7.94531 19.0965C7.78303 19.0234 7.60184 19.0002 7.42777 19.0372L4.3677 19.6879Z"
                  fill="#1B3439"
                  stroke="#1B3439"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span class="section-header__text">Assistant</span>
            </div>
          </div>

          @if (showAssistant()) {
            <assistant class="content-area" [showAssistant]="showAssistant()" [instanceId]="instanceId()" (isStreaming)="isStreaming.set($event)" />
          }
        </div>
      </app-widget-wrapper>
    }

    <!-- Bookmarks Widget -->
    <app-widget-wrapper widgetId="bookmarks">
      <div class="glass-container glass-container--full">
        <div class="section-header">
          <div class="section-header__inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" class="section-header__icon">
              <path
                d="M18 6.27915C18 5.13145 18 4.5576 17.782 4.11901C17.5903 3.7334 17.2843 3.41988 16.908 3.22339C16.48 3 15.92 3 14.8 3H9.2C8.08 3 7.52 3 7.092 3.22339C6.71569 3.41988 6.40974 3.7334 6.218 4.11901C6 4.5576 6 5.13145 6 6.27915V19.9132C6 20.4113 6 20.6603 6.101 20.7966C6.14464 20.8558 6.20034 20.9047 6.26422 20.9397C6.32811 20.9748 6.39866 20.9951 6.471 20.9995C6.638 21.0097 6.84 20.8714 7.244 20.5957L12 17.3463L16.756 20.5947C17.16 20.8714 17.362 21.0097 17.53 20.9995C17.6022 20.995 17.6725 20.9745 17.7362 20.9395C17.7999 20.9045 17.8555 20.8557 17.899 20.7966C18 20.6603 18 20.4113 18 19.9132V6.27915Z"
                fill="#1B3439" />
            </svg>
            <span class="section-header__text">Bookmarks</span>
          </div>
        </div>

        <div class="content-area">
          <Bookmarks />
        </div>
      </div>
    </app-widget-wrapper>

    <!-- Collections Widget -->
    <app-widget-wrapper widgetId="collections">
      <div class="glass-container glass-container--full">
        <!--        <div class="section-header">-->
        <!--          <div class="section-header__inner">-->
        <!--            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="section-header__icon">-->
        <!--              <path-->
        <!--                d="M0 16.0714C0 16.5829 0.197544 17.0735 0.549175 17.4351C0.900805 17.7968 1.37772 18 1.875 18H18.125C18.6223 18 19.0992 17.7968 19.4508 17.4351C19.8025 17.0735 20 16.5829 20 16.0714V7.07143C20 6.55994 19.8025 6.0694 19.4508 5.70772C19.0992 5.34605 18.6223 5.14286 18.125 5.14286H1.875C1.37772 5.14286 0.900805 5.34605 0.549175 5.70772C0.197544 6.0694 0 6.55994 0 7.07143L0 16.0714ZM2.5 3.21429C2.5 3.38478 2.56585 3.5483 2.68306 3.66885C2.80027 3.78941 2.95924 3.85714 3.125 3.85714H16.875C17.0408 3.85714 17.1997 3.78941 17.3169 3.66885C17.4342 3.5483 17.5 3.38478 17.5 3.21429C17.5 3.04379 17.4342 2.88028 17.3169 2.75972C17.1997 2.63916 17.0408 2.57143 16.875 2.57143H3.125C2.95924 2.57143 2.80027 2.63916 2.68306 2.75972C2.56585 2.88028 2.5 3.04379 2.5 3.21429ZM5 0.642857C5 0.813353 5.06585 0.976867 5.18306 1.09743C5.30027 1.21798 5.45924 1.28571 5.625 1.28571H14.375C14.5408 1.28571 14.6997 1.21798 14.8169 1.09743C14.9342 0.976867 15 0.813353 15 0.642857C15 0.472361 14.9342 0.308848 14.8169 0.188288C14.6997 0.0677294 14.5408 0 14.375 0H5.625C5.45924 0 5.30027 0.0677294 5.18306 0.188288C5.06585 0.308848 5 0.472361 5 0.642857Z"-->
        <!--                fill="#1B3439" />-->
        <!--            </svg>-->
        <!--            <span class="section-header__text">Collections</span>-->
        <!--          </div>-->
        <!--        </div>-->

        <div class="content-area">
          <Collections />
        </div>
      </div>
    </app-widget-wrapper>

    <!-- Preview Widget -->
    <app-widget-wrapper widgetId="preview">
      <app-preview-default [previewData]="selectedArticlePreviewData()" />
    </app-widget-wrapper>

    <!-- Explore Widget -->
    <app-widget-wrapper widgetId="explore">
      <div class="glass-container glass-container--full">
        <div class="section-header">
          <!-- Header Title-->
          <div class="section-header__inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none" class="section-header__icon">
              <path
                d="M14.1974 12.467C14.256 11.983 14.3 11.499 14.3 11.0003C14.3 10.5017 14.256 10.0177 14.1974 9.53366H16.676C16.7934 10.003 16.8667 10.4943 16.8667 11.0003C16.8667 11.5063 16.7934 11.9977 16.676 12.467M12.8994 16.5443C13.3394 15.7303 13.6767 14.8503 13.9114 13.9337H16.0747C15.3642 15.1571 14.237 16.0838 12.8994 16.5443ZM12.716 12.467H9.28402C9.21069 11.983 9.16669 11.499 9.16669 11.0003C9.16669 10.5017 9.21069 10.0103 9.28402 9.53366H12.716C12.782 10.0103 12.8334 10.5017 12.8334 11.0003C12.8334 11.499 12.782 11.983 12.716 12.467ZM11 16.8377C10.3914 15.9577 9.90002 14.9823 9.59935 13.9337H12.4007C12.1 14.9823 11.6087 15.9577 11 16.8377ZM8.06669 8.06699H5.92535C6.62836 6.84015 7.75477 5.9119 9.09335 5.45633C8.65335 6.27033 8.32335 7.15033 8.06669 8.06699ZM5.92535 13.9337H8.06669C8.32335 14.8503 8.65335 15.7303 9.09335 16.5443C7.75742 16.084 6.6325 15.157 5.92535 13.9337ZM5.32402 12.467C5.20669 11.9977 5.13335 11.5063 5.13335 11.0003C5.13335 10.4943 5.20669 10.003 5.32402 9.53366H7.80269C7.74402 10.0177 7.70002 10.5017 7.70002 11.0003C7.70002 11.499 7.74402 11.983 7.80269 12.467M11 5.15566C11.6087 6.03566 12.1 7.01833 12.4007 8.06699H9.59935C9.90002 7.01833 10.3914 6.03566 11 5.15566ZM16.0747 8.06699H13.9114C13.6815 7.15884 13.3416 6.28214 12.8994 5.45633C14.2487 5.91833 15.3707 6.84966 16.0747 8.06699ZM11 3.66699C6.94469 3.66699 3.66669 6.96699 3.66669 11.0003C3.66669 12.9452 4.4393 14.8105 5.81457 16.1858C6.49553 16.8667 7.30395 17.4069 8.19368 17.7754C9.0834 18.144 10.037 18.3337 11 18.3337C12.9449 18.3337 14.8102 17.561 16.1855 16.1858C17.5607 14.8105 18.3334 12.9452 18.3334 11.0003C18.3334 10.0373 18.1437 9.0837 17.7751 8.19398C17.4066 7.30426 16.8664 6.49584 16.1855 5.81488C15.5045 5.13391 14.6961 4.59374 13.8064 4.22521C12.9166 3.85667 11.963 3.66699 11 3.66699Z"
                fill="#1B3439" />
            </svg>
            <span class="section-header__text">Explore</span>
          </div>

          <!-- Search Input-->
          <app-search-input
            class="section-header__search-input"
            variant="basic"
            [showSave]="true"
            (saved)="saveSearch($event)"
            (validated)="validated($event)"
            (debounced)="debounced($event)">
            <app-autocomplete [text]="searchText()" (onClick)="autocompleteItemClicked($event)" />
          </app-search-input>
        </div>

        <div class="filters-bar">
          <filters-bar />
        </div>

        <ul class="results-list" role="list" aria-label="results">
          @for (page of query.data()?.pages; track page) {
            @for (article of page.records; track article.id + $index) {
              <ng-container
                *ngComponentOutlet="getArticleType(article?.docformat); inputs: { article, strategy: 'replace', allowAI: allowAI() && enabledUserInput() }" />
            }
          }
        </ul>

        <div class="sort-export-controls">
          <sort-selector [result]="result()!" [position]="position()" (onSort)="onSort($event)" />
        </div>
      </div>
    </app-widget-wrapper>

    <!-- No Results Found -->
  } @else {
    <app-widget-wrapper widgetId="explore">
      <div class="sticky-header">
        @if (isTabSearchActive()) {
          <navbar-tabs class="navbar-tabs" />
        }
        <filters-bar class="filters-bar" />
      </div>
      <NoResult class="no-result" />
    </app-widget-wrapper>
  }
</app-canvas>
