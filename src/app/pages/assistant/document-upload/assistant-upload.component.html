<div class="section-header">
  <h3 class="section-title">
    <i class="far fa-folder-open me-1"></i>
    {{ 'assistant.my-documents' | transloco }}
  </h3>

  <div class="header-actions">
    <!-- Menu button with dropdown -->
    <div class="menu-container">
      <button
        class="icon-button menu-trigger"
        [title]="'assistant.menu' | transloco"
        [attr.aria-label]="'assistant.menu' | transloco"
        (click)="toggleMenu($event)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M6 10C6.53043 10 7.03914 10.2107 7.41421 10.5858C7.78929 10.9609 8 11.4696 8 12C8 12.5304 7.78929 13.0391 7.41421 13.4142C7.03914 13.7893 6.53043 14 6 14C5.46957 14 4.96086 13.7893 4.58579 13.4142C4.21071 13.0391 4 12.5304 4 12C4 11.4696 4.21071 10.9609 4.58579 10.5858C4.96086 10.2107 5.46957 10 6 10ZM18 10C18.5304 10 19.0391 10.2107 19.4142 10.5858C19.7893 10.9609 20 11.4696 20 12C20 12.5304 19.7893 13.0391 19.4142 13.4142C19.0391 13.7893 18.5304 14 18 14C17.4696 14 16.9609 13.7893 16.5858 13.4142C16.2107 13.0391 16 12.5304 16 12C16 11.4696 16.2107 10.9609 16.5858 10.5858C16.9609 10.2107 17.4696 10 18 10ZM12.1808 10C12.7112 10 13.2199 10.2107 13.595 10.5858C13.9701 10.9609 14.1808 11.4696 14.1808 12C14.1808 12.5304 13.9701 13.0391 13.595 13.4142C13.2199 13.7893 12.7112 14 12.1808 14C11.6504 14 11.1417 13.7893 10.7666 13.4142C10.3915 13.0391 10.1808 12.5304 10.1808 12C10.1808 11.4696 10.3915 10.9609 10.7666 10.5858C11.1417 10.2107 11.6504 10 12.1808 10Z"
            fill="currentColor" />
        </svg>
      </button>

      <!-- Dropdown menu -->
      <div class="dropdown-menu" [class.show]="isMenuOpen">
        <button class="dropdown-item" [title]="'assistant.refresh' | transloco" (click)="documentList?.updateUploadedDocumentsList(); closeMenu()">
          <i class="fas fa-sync"></i>
          <span>{{ 'assistant.refresh' | transloco }}</span>
        </button>
        <button class="dropdown-item" [title]="'assistant.delete-all' | transloco" (click)="documentList?.deleteAllDocuments(); closeMenu()">
          <i class="fas fa-trash"></i>
          <span>{{ 'assistant.delete-all' | transloco }}</span>
        </button>
      </div>
    </div>

    <!-- Collapse/Expand arrow -->
    <button
      class="icon-button collapse-trigger"
      [title]="isCollapsed ? ('assistant.expand' | transloco) : ('assistant.collapse' | transloco)"
      [attr.aria-label]="isCollapsed ? ('assistant.expand' | transloco) : ('assistant.collapse' | transloco)"
      [class.collapsed]="isCollapsed"
      (click)="toggleCollapse()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M16.2793 8.10654C16.6621 7.70873 17.2953 7.6965 17.6933 8.0792C18.0913 8.462 18.1034 9.0952 17.7207 9.49326L12.7207 14.6935L12.6465 14.7628C12.4667 14.9152 12.2379 15.0001 12 15.0001C11.7281 15.0001 11.4678 14.8894 11.2793 14.6935L6.27928 9.49326C5.89653 9.0952 5.90866 8.462 6.30663 8.0792C6.70463 7.6965 7.33786 7.70873 7.72069 8.10654L12 12.5577L16.2793 8.10654Z"
          fill="currentColor" />
      </svg>
    </button>
  </div>
</div>

<!-- Collapsible content -->
<div class="collapsible-content" [class.collapsed]="isCollapsed">
  <sq-document-overview #documentOverview [instanceId]="instanceId()" [disabledUpload]="false" (onUpload)="uploadDialog?.showModal()"></sq-document-overview>
  <sq-document-list #documentList [instanceId]="instanceId()"></sq-document-list>
</div>

<dialog #uploadDialog (closed)="documentOverview.updateUploadedDocumentsList()">
  <DialogHeader>
    <DialogTitle>{{ 'assistant.upload' | transloco }}</DialogTitle>
  </DialogHeader>

  <DialogContent class="dialog-content">
    <sq-document-upload [instanceId]="instanceId()" />
  </DialogContent>

  <DialogFooter>
    <button class="btn btn-secondary" (click)="uploadDialog.close($event)">
      {{ 'close' | transloco }}
    </button>
  </DialogFooter>
</dialog>
