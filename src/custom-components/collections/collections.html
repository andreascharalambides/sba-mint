        fill="currentColor" />
    </svg>
  </div>
  <label class="header-title">Collections</label>
</div>

<ul class="list-container">
  @for (collection of paginatedCollections(); track $index) {
    <li role="listitem" class="list-item" tabindex="0" (click)="onClick(collection)" (keydown.enter)="onClick(collection)">
      <p class="item-name">{{ collection.name }}</p>

      <button
        variant="icon"
        class="delete-button"
        title="{{ 'collections.deleteCollection' | transloco }}"
        [attr.aria-label]="'collections.deleteCollection' | transloco"
        (click)="onDelete(collection, $index, $event)">
        <i class="fa-fw fa-regular fa-trash-can" aria-hidden="true"></i>
      </button>
    </li>
  } @empty {
    <li class="empty-state">{{ 'collections.noCollections' | transloco }}</li>
  }
</ul>

<div class="actions-container">
  @if (hasMore() && config.showLoadMore) {
    <button variant="outline" class="load-more-button" tabindex="0" [attr.title]="'loadMore' | transloco" (click)="loadMore($event)">
      {{ 'loadMore' | transloco }}
    </button>
  }
  <button variant="link" class="see-more-button" [attr.title]="'seeMore' | transloco" [routerLink]="[config.routerLink]">{{ 'seeMore' | transloco }}</button>
</div>

<delete-collection-dialog />
